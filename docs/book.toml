[book]
title = "Dive Computer Protocols"
description = "Open specification of dive computer download protocols and dive data formats"
authors = ["divecomputer-rs contributors"]
language = "en"
src = "."

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/michidk/divecomputer-rs"
edit-url-template = "https://github.com/michidk/divecomputer-rs/edit/main/docs/{path}"
additional-css = ["theme/custom.css"]
additional-js = ["theme/table-scroll.js"]

[output.html.search]
limit-results = 40

# mdBook emits README chapters as index.html; preserve links to the older spelling.
[output.html.redirect]
"spec/README.html" = "index.html"
"spec/transports/README.html" = "index.html"
"spec/families/README.html" = "index.html"
