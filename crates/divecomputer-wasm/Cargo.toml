[package]
name = "divecomputer-wasm"
description = "JavaScript bindings for divecomputer-rs: download dive computers from the browser"
readme = "README.md"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
divecomputer-core = { workspace = true, features = ["serde"] }
divecomputer-export.workspace = true
divecomputer-protocol.workspace = true
divecomputer-transport.workspace = true
divejson = { workspace = true, features = ["uddf"] }
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["BluetoothDevice"] }

[lints]
workspace = true
