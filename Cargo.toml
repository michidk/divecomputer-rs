[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Michael Lohr <michael@lohr.dev>"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michidk/divecomputer-rs"
homepage = "https://michidk.github.io/divecomputer-rs/"
keywords = ["dive-computer", "diving", "scuba", "dive-log"]
categories = ["hardware-support", "parser-implementations", "no-std", "wasm"]

[workspace.dependencies]
crc = { version = "3.4", default-features = false }
divecomputer-core = { version = "0.1.0", path = "crates/divecomputer-core" }
divecomputer-export = { version = "0.1.0", path = "crates/divecomputer-export" }
divecomputer-protocol = { version = "0.1.0", path = "crates/divecomputer-protocol" }
divecomputer-transport = { version = "0.1.0", path = "crates/divecomputer-transport" }
divejson = { version = "0.1.0", default-features = false }
insta = "1"
js-sys = "=0.3.106"
jiff = { version = "1.0.3", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde-wasm-bindgen = "0.6"
thiserror = { version = "2", default-features = false }
uuid = { version = "1.16", default-features = false, features = ["v5"] }
# Pinned: must match the wasm-bindgen CLI version that generates the JavaScript glue.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = "=0.3.106"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
as_conversions = "warn"
